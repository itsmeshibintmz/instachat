# ── Render deployment configuration ──────────────────────────────────────────
# Render free tier: 512MB RAM, 0.1 CPU, no credit card needed.
# To keep the service alive (prevent 15-min sleep) set up a free UptimeRobot
# monitor at uptimerobot.com to ping /health every 5 minutes.

services:
  - type: web
    name: instachat-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: ./backend      # build context = backend/ so COPY paths resolve correctly
    plan: free
    healthCheckPath: /health
    # Render injects PORT automatically; Dockerfile reads ${PORT:-8000}
