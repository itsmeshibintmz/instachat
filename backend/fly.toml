# ── Fly.io deployment configuration ──────────────────────────────────────────
# fly.toml lives in backend/ so `flyctl deploy --config backend/fly.toml`
# uses backend/ as the build context (matches our Dockerfile's COPY paths).
#
# Fly.io free tier: 3 shared-cpu-1x VMs + 3 GB volumes — no credit card needed.
# Docs: https://fly.io/docs/

app            = "instachat-backend"
primary_region = "sin"          # Singapore — closest free region to India

[build]
  # Dockerfile is in the same directory as this fly.toml (backend/)
  dockerfile = "Dockerfile"

[http_service]
  internal_port       = 8000
  force_https         = true
  auto_stop_machines  = "off"   # ← IMPORTANT: keep alive for polling + WebSocket
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 50
    soft_limit = 25

# Persistent volume — Instagram session survives container restarts/redeploys
[[mounts]]
  source      = "instachat_sessions"
  destination = "/app/sessions"
  initial_size = "1gb"

[env]
  INSTACHAT_PORT = "8000"

# Free-tier machine size — 1 shared CPU, 256 MB RAM
[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
