name: Build & Release

# Allow the workflow to create & update GitHub Releases
permissions:
  contents: write

# ── Triggers ───────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]          # Debug builds → rolling 'latest' release
    tags: ['v*.*.*']          # Release builds → versioned GitHub Release
  pull_request:
    branches: [main]          # Analyze only on PRs
  workflow_dispatch:          # Allow manual trigger from GitHub Actions UI

# ── Jobs ───────────────────────────────────────────────────────────────────
jobs:

  # ── Analyze ──────────────────────────────────────────────────────────────
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Analyze
        run: flutter analyze
        working-directory: app

  # ── Android build ─────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: analyze

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      # ── Debug build (main branch) ─────────────────────────────────────────
      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: flutter build apk --debug
        working-directory: app

      - name: Publish rolling debug release
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Debug Build"
          prerelease: true
          make_latest: false
          body: |
            🤖 **Auto-built** from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on `main`.

            This is a rolling debug build — always reflects the latest code.
            Not a stable release.

            ### Install on Android
            1. Download `instachat-debug.apk` below
            2. Enable **Install from unknown sources** on your device
            3. Install the APK — make sure the Python backend is running on your Mac first
          files: app/build/app/outputs/flutter-apk/app-debug.apk

      # ── Release build (version tags) ─────────────────────────────────────
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release
        working-directory: app

      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             dist/instachat-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: InstaChat ${{ github.ref_name }}
          make_latest: true
          body: |
            ## InstaChat ${{ github.ref_name }}

            ### Install
            1. Download `instachat-${{ github.ref_name }}.apk` below
            2. Enable "Install from unknown sources" on your Android device
            3. Install the APK

            > Make sure the Python backend is running on your machine before opening the app.
          files: dist/instachat-${{ github.ref_name }}.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── iOS build ─────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    if: github.event_name != 'pull_request'
    needs: analyze

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Build iOS (no codesign)
        run: flutter build ipa --no-codesign
        working-directory: app

      - name: Locate IPA
        run: |
          IPA=$(find app/build/ios/ipa -name "*.ipa" 2>/dev/null | head -1)
          echo "IPA_PATH=${IPA}" >> $GITHUB_ENV
          echo "Found IPA: ${IPA}"

      - name: Publish iOS IPA to rolling debug release
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Debug Build"
          prerelease: true
          make_latest: false
          body: |
            🤖 **Auto-built** from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on `main`.

            This is a rolling debug build — always reflects the latest code.
            Not a stable release.

            ### Android
            Download `instachat-debug.apk` → enable **Install from unknown sources** → install.

            ### iOS (unsigned IPA)
            The IPA is built without a codesigning certificate.
            To install on a real device, sign it with your Apple Developer account or use AltStore/Sideloadly.

            > Make sure the Python backend is running on your Mac before opening the app.
          files: ${{ env.IPA_PATH }}

      - name: Upload IPA artifact (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.6.2
        with:
          name: instachat-ios-${{ github.ref_name }}
          path: ${{ env.IPA_PATH }}
          retention-days: 90
