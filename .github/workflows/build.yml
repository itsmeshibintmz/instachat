name: CI

permissions:
  contents: write

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]       # Debug builds → rolling 'latest' pre-release
  pull_request:
    branches: [main]       # Analyze only — no build on PRs
  workflow_dispatch:

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── Analyze ──────────────────────────────────────────────────────────────
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      - run: flutter analyze
        working-directory: app

  # ── Android debug build ───────────────────────────────────────────────────
  build-android-debug:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      - run: flutter build apk --debug
        working-directory: app

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-debug.apk dist/instachat-debug.apk

      - name: Publish to rolling debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🔧 Latest Debug Build"
          prerelease: true
          make_latest: false
          body: |
            > 🤖 Auto-built from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) — always reflects the latest `main`.
            > Not a stable release. For stable builds see [Releases](${{ github.server_url }}/${{ github.repository }}/releases).

            ### Android — install `instachat-debug.apk`
            1. Download the APK below
            2. Enable **Install unknown apps** on your device
            3. Open the APK and install

            ### iOS — see `instachat-debug.ipa`
            Unsigned — sideload with [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io).

            ### Backend
            ```bash
            cd backend && source .venv/bin/activate
            uvicorn app.main:app --host 0.0.0.0 --port 8000
            adb reverse tcp:8000 tcp:8000   # USB tunnel for Android
            ```
          files: dist/instachat-debug.apk

  # ── iOS debug build ───────────────────────────────────────────────────────
  build-ios-debug:
    name: Build iOS (debug)
    runs-on: macos-latest
    if: github.event_name != 'pull_request'
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      - run: flutter build ipa --no-codesign
        working-directory: app

      - name: Package xcarchive → IPA
        run: |
          mkdir -p dist/Payload
          cp -r "app/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" dist/Payload/
          cd dist && zip -r instachat-debug.ipa Payload && cd ..
          echo "Packaged: dist/instachat-debug.ipa ($(du -sh dist/instachat-debug.ipa | cut -f1))"

      - name: Publish to rolling debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🔧 Latest Debug Build"
          prerelease: true
          make_latest: false
          files: dist/instachat-debug.ipa
