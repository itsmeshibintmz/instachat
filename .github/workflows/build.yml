name: Build & Release

# ── Triggers ───────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]          # Build debug APK on every merge to main
    tags: ['v*.*.*']          # Build release APK + create GitHub Release on tag
  pull_request:
    branches: [main]          # Analyze only on PRs (no APK needed)
  workflow_dispatch:          # Allow manual trigger from GitHub Actions UI

# ── Jobs ───────────────────────────────────────────────────────────────────
jobs:

  # ── Analyze ──────────────────────────────────────────────────────────────
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Analyze
        run: flutter analyze
        working-directory: app

  # ── Android build ─────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Only build APK on main pushes and tags, not on PRs
    if: github.event_name != 'pull_request'
    needs: analyze

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      # ── Debug build (main branch pushes) ──────────────────────────────────
      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: flutter build apk --debug
        working-directory: app

      - name: Upload debug APK as artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4.6.2
        with:
          name: instachat-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # ── Release build (version tags only) ────────────────────────────────
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release
        working-directory: app

      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             dist/instachat-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: InstaChat ${{ github.ref_name }}
          body: |
            ## InstaChat ${{ github.ref_name }}

            ### Install
            1. Download `instachat-${{ github.ref_name }}.apk` below
            2. Enable "Install from unknown sources" on your Android device
            3. Install the APK

            > Make sure the Python backend is running on your machine before opening the app.
          files: dist/instachat-${{ github.ref_name }}.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
