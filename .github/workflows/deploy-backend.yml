name: Deploy Backend

# ─────────────────────────────────────────────────────────────────────────────
# Deploys the FastAPI backend to Render (free tier, no credit card).
#
# How Render deploy hooks work: POST to a secret URL → triggers a redeploy.
# No CLI, no SDK — just one curl command.
#
# One-time setup:
#   1. render.com → New → Web Service → connect GitHub → pick instachat
#        Runtime:         Docker
#        Dockerfile path: backend/Dockerfile
#        Plan:            Free
#   2. Your service → Settings → Deploy Hook → copy the URL
#   3. GitHub repo → Settings → Secrets → Actions → New secret:
#        RENDER_DEPLOY_HOOK_URL = <hook URL from step 2>
#   4. (Optional but important) uptimerobot.com → New Monitor →
#        HTTP(S), URL: https://<your-app>.onrender.com/health, interval: 5 min
#        This pings every 5 min and prevents Render's free tier from sleeping.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL secret not set — skipping deploy."
            echo "    Add it: GitHub → Settings → Secrets → Actions → New secret"
            exit 0
          fi
          echo "Triggering Render redeploy..."
          curl --fail -X POST "$HOOK_URL"
          echo "✓ Deploy triggered — check https://dashboard.render.com for build status"
