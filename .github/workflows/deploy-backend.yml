name: Deploy Backend

# ─────────────────────────────────────────────────────────────────────────────
# Deploys the FastAPI backend to Fly.io (free tier) whenever backend code
# changes on main.
#
# Fly.io free tier: 3 shared VMs + 3 GB volumes — no credit card needed.
#
# One-time setup:
#   1. flyctl auth signup   (or flyctl auth login if you have an account)
#   2. cd backend && flyctl launch --no-deploy   (creates app + volume)
#   3. flyctl tokens create deploy -x 999999h   (long-lived deploy token)
#   4. GitHub repo → Settings → Secrets → Actions → New secret:
#        FLY_API_TOKEN = <token from step 3>
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:   # allow manual re-deploy from GitHub Actions UI

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Skip gracefully if FLY_API_TOKEN secret is not yet configured
    if: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml
