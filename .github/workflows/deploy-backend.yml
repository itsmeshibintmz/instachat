name: Deploy Backend

# ─────────────────────────────────────────────────────────────────────────────
# Deploys the FastAPI backend to Koyeb (free tier — NO credit card needed).
#
# One-time setup:
#   1. koyeb.com → Sign up with GitHub (no CC required)
#   2. Dashboard → Create App → GitHub → pick instachat repo
#        Builder:    Dockerfile
#        Dockerfile: backend/Dockerfile
#        Port:       8000
#        Region:     any (pick closest)
#   3. Dashboard → Account → API → New API Key
#   4. GitHub repo → Settings → Secrets → Actions → New secret:
#        KOYEB_API_TOKEN = <key from step 3>
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Koyeb
    runs-on: ubuntu-latest
    if: ${{ secrets.KOYEB_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      - name: Redeploy service
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          # Trigger a redeploy of the existing service
          # App + service names must match what you created in the dashboard
          koyeb service redeploy instachat-backend/api
